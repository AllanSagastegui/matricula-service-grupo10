edusmart.costo-credito=120.00
edusmart.sede=Campus Lima Central
edusmart.max-creditos-ciclo=22
edusmart.mensaje-bienvenida=Bienvenido al Sistema de Matricula - Sede Lima (Grupo 10)
edusmart.limite-cuotas-pago=5
spring.datasource.url=jdbc:postgresql://localhost:5432/edusmart_lima_db


spring.application.name=matricula-service-grupo10
server.port=8085


spring.cloud.config.name=matricula-service
spring.profiles.active=lima
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.username=configuser
spring.cloud.config.password=grupo10pass


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.refresh.enable=false

management.endpoints.web.exposure.include=refresh,health,info
management.endpoint.health.show-details=always
management.endpoint.refresh.access=unrestricted
